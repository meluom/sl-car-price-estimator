name: Retrain - validate, train, gate, promote

on:
  push:
    branches: [main]
    paths: ["data/raw/**"]        # new or updated adverts trigger retraining
  schedule:
    - cron: "0 3 1 * *"           # also re-check monthly (1st of each month, 03:00 UTC)
  workflow_dispatch:

permissions:
  contents: write                 # needed to commit the promoted model back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate data, check drift, train, apply quality gate
        run: python train.py
      - name: Test the new model and app
        run: pytest -q tests
      - name: Commit promoted model (Streamlit Cloud redeploys automatically)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --cached --quiet; then
            echo "No model change to commit"
          else
            git commit -m "Retrained model $(python -c "import json;print(json.load(open('models/metadata.json'))['model_version'])") [automated]"
            git push
          fi
